name: Send Contact Email

on:
  repository_dispatch:
    types: [contact-form]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Set recipient
        id: set-to
        run: |
          if [ "${{ github.event.client_payload.email }}" = "aditya.solanki@outlook.com" ]; then
            echo "to=aditya.solanki@aiquantgroup.com" >> $GITHUB_OUTPUT
          else
            echo "to=yoram@elksconnect.com" >> $GITHUB_OUTPUT
          fi

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: reply.5am.earth@gmail.com
          password: ${{ secrets.GPASS }}
          subject: "5am.earth — New inquiry from ${{ github.event.client_payload.name }}"
          to: ${{ steps.set-to.outputs.to }}
          from: "5am.earth Foundation <reply.5am.earth@gmail.com>"
          body: |
            New contact form submission from 5am.earth

            Role: ${{ github.event.client_payload.role }}
            Name: ${{ github.event.client_payload.name }}
            Organization: ${{ github.event.client_payload.organization }}
            Email: ${{ github.event.client_payload.email }}

            Message:
            ${{ github.event.client_payload.message }}
