name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, staging ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: site/staging

      - name: Drop git metadata
        run: rm -rf site/.git site/staging/.git site/staging/.github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
